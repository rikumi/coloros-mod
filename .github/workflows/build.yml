name: Build & Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next version
        id: version
        run: |
          BASE_VERSION=$(sed -nE "s/^[[:space:]]*versionName '([0-9]+\.[0-9]+\.[0-9]+)'/\1/p" app/build.gradle)
          if [ -z "$BASE_VERSION" ]; then
            echo "Missing semantic versionName in app/build.gradle" >&2
            exit 1
          fi
          LATEST=$(git tag --list 'v*' | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            VERSION="$BASE_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERSION=$(printf '%s\n' "$VERSION" "$BASE_VERSION" | sort -V | tail -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION (from $LATEST)"

      - name: Generate release changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="docs/releases/$VERSION.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
            exit 0
          fi
          echo "Missing release notes: $NOTES" >&2
          exit 1

      - name: Bump version in app/build.gradle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          perl -0pi -e "s/versionCode \d+/versionCode $VERSION_CODE/; s/versionName '[0-9.]+'/versionName '$VERSION'/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Install APK verification tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Restore persistent signing key
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        shell: python
        run: |
          import base64
          import json
          import os
          from pathlib import Path

          encoded = os.environ.get('ANDROID_SIGNING_BUNDLE', '')
          if not encoded:
              raise SystemExit('Configure the repository-specific ANDROID_SIGNING_BUNDLE secret; random debug signing is disabled.')
          bundle = json.loads(encoded)
          directory = Path(os.environ['RUNNER_TEMP']) / 'android-signing'
          directory.mkdir(mode=0o700, exist_ok=True)
          keystore = directory / 'module.keystore'
          keystore.write_bytes(base64.b64decode(bundle['keystore'], validate=True))
          keystore.chmod(0o600)
          def property_value(value):
              return str(value).replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t').replace(' ', '\\ ')
          properties = directory / 'signing.properties'
          values = {'storeFile': str(keystore), 'storePassword': bundle['storePassword'],
                    'keyAlias': bundle['keyAlias'], 'keyPassword': bundle['keyPassword']}
          properties.write_text(''.join(f'{key}={property_value(value)}\n' for key, value in values.items()))
          properties.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_SIGNING_PROPERTIES={properties}\n')

      - name: Build Debug and Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Verify APK signing identity
        run: python3 scripts/verify-apk-signature.py app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "no changes"
          git push

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coloros-mod-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

      - name: Sync to Xposed-Modules-Repo
        env:
          TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TARGET: Xposed-Modules-Repo/com.rikumi.colorosmod
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "XPOSED_REPO_TOKEN 未配置，跳过同步"
            exit 0
          fi
          git clone "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" /tmp/xposed-repo
          cp README.md /tmp/xposed-repo/README.md
          cd /tmp/xposed-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README 无变化"
          else
            git commit -m "docs: sync README for v${VERSION}"
            git push
          fi
          git tag "v${VERSION}" || true
          git push origin "v${VERSION}"

      - name: Upload release to Xposed-Modules-Repo
        if: ${{ env.XPOSED_REPO_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        env:
          XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        with:
          repository: Xposed-Modules-Repo/com.rikumi.colorosmod
          token: ${{ secrets.XPOSED_REPO_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
