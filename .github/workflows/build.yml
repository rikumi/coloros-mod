name: Build & Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 以项目声明版本作为发布下限，后续发布对最新正式版本做 patch +1。
      - name: Compute next version
        id: version
        run: |
          BASE_VERSION=$(sed -nE "s/^[[:space:]]*versionName '([0-9]+\.[0-9]+\.[0-9]+)'/\1/p" app/build.gradle)
          if [ -z "$BASE_VERSION" ]; then
            echo "Missing semantic versionName in app/build.gradle" >&2
            exit 1
          fi
          LATEST=$(git tag --list 'v*' | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            VERSION="$BASE_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERSION=$(printf '%s\n' "$VERSION" "$BASE_VERSION" | sort -V | tail -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION (from $LATEST)"

      # 同步写入 app/build.gradle 的 versionCode / versionName
      - name: Bump version in app/build.gradle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          perl -0pi -e "s/versionCode \d+/versionCode $VERSION_CODE/; s/versionName '[0-9.]+'/versionName '$VERSION'/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "no changes"
          git push

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Generate release changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            git log "$RANGE" --pretty=format:'- %s (%h)' \
              --invert-grep --grep='^chore: bump version to '
            echo
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coloros-mod-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: app/build/outputs/apk/debug/*.apk

      # 同步 README 与 release 到 Xposed-Modules-Repo 镜像仓库
      - name: Sync to Xposed-Modules-Repo
        env:
          TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TARGET: Xposed-Modules-Repo/com.rikumi.colorosmod
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "XPOSED_REPO_TOKEN 未配置，跳过同步"
            exit 0
          fi
          git clone "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" /tmp/xposed-repo
          cp README.md /tmp/xposed-repo/README.md
          cd /tmp/xposed-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README 无变化"
          else
            git commit -m "docs: sync README for v${VERSION}"
            git push
          fi
          git tag "v${VERSION}" || true
          git push origin "v${VERSION}"

      - name: Upload release to Xposed-Modules-Repo
        if: ${{ env.XPOSED_REPO_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        env:
          XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        with:
          repository: Xposed-Modules-Repo/com.rikumi.colorosmod
          token: ${{ secrets.XPOSED_REPO_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: app/build/outputs/apk/debug/*.apk
