plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Both variants use an explicit, persistent key; never fall back to a runner-generated key.
def signingPropertiesFile = rootProject.file(
        System.getenv('ANDROID_SIGNING_PROPERTIES') ?: 'signing.properties')
def signingProperties = new Properties()
if (!signingPropertiesFile.isFile()) {
    throw new GradleException('Missing signing.properties. See docs/signing.md; automatic debug signing is disabled.')
}
signingPropertiesFile.withInputStream { signingProperties.load(it) }
['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
    if (!signingProperties.getProperty(key)?.trim()) {
        throw new GradleException("Missing ${key} in signing properties")
    }
}
def signingStoreFile = new File(signingProperties.getProperty('storeFile'))
if (!signingStoreFile.isAbsolute()) {
    signingStoreFile = new File(signingPropertiesFile.parentFile, signingProperties.getProperty('storeFile'))
}
if (!signingStoreFile.isFile()) {
    throw new GradleException('Configured signing keystore does not exist')
}

android {
    namespace 'com.rikumi.colorosmod'
    compileSdk 37

    defaultConfig {
        applicationId 'com.rikumi.colorosmod'
        minSdk 26
        targetSdk 37
        versionCode 10203
        versionName '1.2.3'
    }

    signingConfigs {
        stable {
            storeFile signingStoreFile
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(21)
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // 现代 Xposed API (libxposed), compile-only (provided by the framework at runtime).
    // 入口见 META-INF/xposed/java_init.list, 作用域见 META-INF/xposed/scope.list。
    compileOnly 'io.github.libxposed:api:102.0.0'
    // api 构件里引用了 @SinceApi / @InternalApi, 编译期需要它们在 classpath 上。
    compileOnly 'io.github.libxposed:annotation:1.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // miuix UI (Compose Multiplatform) — settings UI
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.0'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.0'
    implementation 'org.jetbrains.androidx.navigationevent:navigationevent-compose:1.0.1'
    // miuix extended icons (Refresh etc.)
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.0'
}
