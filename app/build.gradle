plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.rikumi.colorosmod'
    compileSdk 37

    defaultConfig {
        applicationId 'com.rikumi.colorosmod'
        minSdk 26
        targetSdk 37
        versionCode 10024
        versionName '1.0.24'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(21)
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // 现代 Xposed API (libxposed), compile-only (provided by the framework at runtime).
    // 入口见 META-INF/xposed/java_init.list, 作用域见 META-INF/xposed/scope.list。
    compileOnly 'io.github.libxposed:api:102.0.0'
    // api 构件里引用了 @SinceApi / @InternalApi, 编译期需要它们在 classpath 上。
    compileOnly 'io.github.libxposed:annotation:1.0.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // miuix UI (Compose Multiplatform) — settings UI
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.0'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.0'
    implementation 'org.jetbrains.androidx.navigationevent:navigationevent-compose:1.0.1'
    // miuix extended icons (Refresh etc.)
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.0'
}
